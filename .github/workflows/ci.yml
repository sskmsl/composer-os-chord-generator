name: CI

# mainへ入る前(プルリクエスト)に、型・lint・テスト・ビルドを確認する。
# main自体へのpushはdeploy-pages.ymlがテスト込みで検証する。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
